<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f20"><title>LINK ARENA Mobile v0.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09271c;color:#fff5d6;font-family:system-ui,-apple-system,sans-serif}button{touch-action:manipulation;cursor:pointer;font:inherit;border:0;border-radius:12px;padding:13px;font-weight:800}main{max-width:720px;margin:auto;padding:12px;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;color:#ffdc83;margin:6px 0}.small{font-size:12px;color:#bdd9c8}.table{height:44dvh;min-height:300px;border:8px solid #78512b;border-radius:28px;position:relative;background:radial-gradient(ellipse,#0ca958,#075d37);box-shadow:inset 0 0 0 3px #d2b36b;overflow:hidden}.cpu{position:absolute;background:#093c2bdc;border:1px solid #8ba58b;border-radius:20px;padding:7px;font-size:12px}.top{top:9px;left:50%;transform:translateX(-50%)}.left{top:45%;left:5px}.right{top:45%;right:5px}.board{position:absolute;left:3%;right:3%;top:33%;height:135px;display:flex;align-items:center;justify-content:flex-start;gap:0;overflow-x:auto;padding:8px 12px}.board .tile{margin-right:-8px}.board .tile{flex-shrink:0}.tile{--c:#e8bc70;position:relative;background:var(--c);color:#17362b;width:73px;height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 9px;font-weight:900;text-align:center;user-select:none}.tile svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;filter:drop-shadow(0 2px 2px #0008)}.tile{isolation:isolate;background:transparent;width:84px;height:110px;flex-shrink:0}.tile b{font-size:23px}.tile small{font-size:10px}.tile.selected{outline:3px solid #fff;filter:brightness(1.2);transform:translateY(-10px)}.hand{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:18px 3px 12px;min-height:130px}.hand .tile{flex-shrink:0}.actions{display:flex;gap:9px}.actions button{flex:1;background:#f8d678;color:#193529;min-height:54px}.actions button:last-child{background:#e4f0e8;flex:.65}.actions button:disabled{opacity:.45}.info{background:#123f30;border:1px solid #527f66;padding:12px;border-radius:14px;margin:10px 0;font-size:14px;line-height:1.6}.overlay{position:fixed;inset:0;background:#001a13d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.panel{width:min(100%,450px);background:linear-gradient(#315746,#17392e);border:3px solid #efd27e;border-radius:24px;padding:24px;text-align:center;box-shadow:0 15px 60px #000a}.panel h2{color:#ffe18b;font-size:32px;margin:5px}.panel p{line-height:1.8}.panel button{width:100%;background:#ffdb7a;color:#233b2d;min-height:56px;margin-top:10px}.hidden{display:none}.msg{font-size:13px;text-align:center;margin-top:10px;color:#e9dcae}
</style></head><body><main><header><div><h1>LINK ARENA</h1><div class="small">Mobile · パズルカード対戦</div></div><div id="turn" class="small">ゲーム開始前</div></header>
<div class="table"><div class="cpu top" id="cpu2">🤖 CPU 2</div><div class="cpu left" id="cpu1">🤖 CPU 1</div><div class="cpu right" id="cpu3">🤖 CPU 3</div><div class="board" id="board"></div></div>
<div class="info" id="info">カードを選び、左右の接続口が合う場所につなげます。左右で形が違うので、接続先を選びましょう。</div><div class="small">あなたの手札 <span id="count"></span></div><div class="hand" id="hand"></div>
<div class="actions"><button id="playLeft">◀ 左につなぐ</button><button id="playRight">右につなぐ ▶</button><button id="draw">引く</button></div><div class="msg" id="message">ゲームスタートを押してください。</div></main>
<div class="overlay" id="overlay"><div class="panel"><h2 id="modalTitle">LINK ARENA</h2><p id="modalText">パズルの凹凸を合わせてカードをつなぐ対戦ゲーム。カードを選んで左右に配置し、最初に手札をなくした人が勝ち！</p><button id="modalButton" type="button">▶ ゲームスタート</button></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const names=["ただのカード","ドロー1","リバース","突風","救済","ミミック","鍛冶屋"];
const descriptions=["特殊効果なし。凹凸をつなげて出します。","次のプレイヤーがカードを1枚引きます。","プレイする順番が逆になります。","次のプレイヤーの手番を飛ばします。","自分の手札から追加で1枚捨てます。","接続する形を合わせやすい万能カードです。","手札を1枚交換します。"];
const colors=["#eec56c","#a7dcf3","#f3a6af","#b4dfad","#d4b2ef"];
let players=[],board=[],turn=0,direction=1,selected=-1,started=false,locked=false,modalAction=null;
const rnd=n=>Math.floor(Math.random()*n);
function card(){const type=rnd(7);return {type,shape:rnd(3),left:rnd(3),right:rnd(3),color:rnd(colors.length)}}
function match(a,b){return (a===2&&b===2)||(a===0&&b===1)||(a===1&&b===0)}
function edge(k,side){if(side==="r")return k===1?"L 68 35 C 87 28 95 47 79 55 C 95 63 87 82 68 75":k===0?"L 68 35 C 53 28 53 47 64 55 C 53 63 53 82 68 75":"L 68 75";return k===1?"L 16 75 C -3 82 -11 63 5 55 C -11 47 -3 28 16 35":k===0?"L 16 75 C 31 82 31 63 20 55 C 31 47 31 28 16 35":"L 16 35"}
function tile(c,i,hand){const e=document.createElement("div");e.className="tile"+(hand&&selected===i?" selected":"");const d="M 16 5 L 68 5 "+edge(c.right,"r")+" L 68 105 L 16 105 "+edge(c.left,"l")+" Z";e.innerHTML='<svg viewBox="0 0 84 110" aria-hidden="true"><path d="'+d+'" fill="'+colors[c.color]+'" stroke="#674c2d" stroke-width="2.5" stroke-linejoin="round"/></svg><b>'+["●","◆","✦"][c.shape]+'</b><small>'+names[c.type]+'</small>';if(hand){e.addEventListener("click",()=>{selected=i;render();$("info").textContent=names[c.type]+"： "+descriptions[c.type]})}return e}
function show(title,desc,label,fn){$("modalTitle").textContent=title;$("modalText").textContent=desc;$("modalButton").textContent=label;$("overlay").classList.remove("hidden");modalAction=fn}
$("modalButton").addEventListener("click",()=>{const fn=modalAction;$("overlay").classList.add("hidden");modalAction=null;if(fn)fn()});
function start(){players=Array.from({length:4},()=>Array.from({length:7},card));board=[card()];players[0][0].left=board[0].right===2?2:1-board[0].right;players[0][0].type=0;turn=0;direction=1;selected=-1;started=true;locked=false;render();$("message").textContent="あなたの番です。カードを選択してください。"}
function valid(c,side){return c.type===5||board.length===0||(side==="left"?match(c.right,board[0].left):match(c.left,board[board.length-1].right))}
function render(){const b=$("board");b.replaceChildren();board.forEach(c=>b.appendChild(tile(c,0,false)));const h=$("hand");h.replaceChildren();players[0]?.forEach((c,i)=>h.appendChild(tile(c,i,true)));$("count").textContent=players[0]?.length+"枚";for(let i=1;i<=3;i++)$("cpu"+i).textContent="🤖 CPU "+i+" "+(players[i]?.length??7)+"枚";$("turn").textContent=started?(turn===0?"あなたの番":"CPU "+turn+" の番"):"ゲーム開始前";$("playLeft").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"left");$("playRight").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"right");$("draw").disabled=!started||locked||turn!==0}
function advance(){turn=(turn+direction+4)%4;locked=turn!==0;render();if(turn!==0){setTimeout(cpuMove,750)}else{$("message").textContent="あなたの番です。カードを選んでください。"}}
function finish(i){started=false;locked=true;render();show(i===0?"あなたの勝利！":"CPU "+i+" の勝利", "手札をすべて出しました。もう一度遊べます。","もう一度プレイ",start)}
function apply(i,idx,side="right"){const c=players[i].splice(idx,1)[0];if(c.type===5&&board.length){if(side==="left")c.right=board[0].left===2?2:1-board[0].left;else c.left=board[board.length-1].right===2?2:1-board[board.length-1].right}if(side==="left")board.unshift(c);else board.push(c);selected=-1;let text=descriptions[c.type];if(c.type===1){let target=(i+direction+4)%4;players[target].push(card());text="次のプレイヤーがカードを1枚引きました。"}if(c.type===2){direction*=-1;text="ターンの進行方向が逆になりました。"}if(c.type===3){turn=(turn+direction+4)%4;text="次のプレイヤーの手番を飛ばしました。"}if(c.type===4&&players[i].length){players[i].splice(rnd(players[i].length),1);text="手札を追加で1枚捨てました。"}if(c.type===6&&players[i].length){players[i].splice(rnd(players[i].length),1);players[i].push(card());text="手札を1枚交換しました。"}render();show(names[c.type],text,"確認して次へ",()=>{if(players[i].length===0)finish(i);else advance()})}
for(const side of ["left","right"]){$(side==="left"?"playLeft":"playRight").addEventListener("click",()=>{if(!started||locked||turn!==0||selected<0)return;const c=players[0][selected];if(!valid(c,side)){$("info").textContent="この側の接続口には合いません。";return}locked=true;apply(0,selected,side)})}
$("draw").addEventListener("click",()=>{if(!started||locked||turn!==0)return;players[0].push(card());selected=-1;render();$("message").textContent="カードを1枚引きました。";advance()});
function cpuMove(){if(!started)return;const i=turn;let side="right";let idx=players[i].findIndex(c=>valid(c,"right"));if(idx<0){side="left";idx=players[i].findIndex(c=>valid(c,"left"))}if(idx<0){players[i].push(card());$("message").textContent="CPU "+i+" は1枚引きました。";advance()}else apply(i,idx,side)}
show("LINK ARENA","カードの凹凸を合わせるパズル型カード対戦。手札を先になくした人が勝ちです。カードをタップすると効果を読めます。","▶ ゲームスタート",start);
})();
</script></body></html>
