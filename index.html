function tile(c,i,hand){const e=document.createElement("div");e.className="tile"+(hand&&selected===i?" selected":"");const d="M 16 5 L 88 5 "+edge(c.right,"r")+" L 88 105 L 16 105 "+edge(c.left,"l")+" Z";e.innerHTML='<svg class="card-outline" viewBox="0 0 112 110" aria-hidden="true"><path d="'+d+'" fill="'+colors[c.color]+'" stroke="#674c2d" stroke-width="2.5" stroke-linejoin="round"/><path d="M 42 13 H 71" stroke="#fff9" stroke-width="2"/></svg><div class="tile-content">'+illustration(c.type)+'<small>'+names[c.type]+'</small></div>';if(!hand&&c===lastPlaced)e.classList.add("new-card");if(hand){e.addEventListener("click",()=>{window.LAAudio?.cue("select");selected=i;render();$("info").textContent=names[c.type]+"： "+descriptions[c.type]+"　接続可能："+(valid(c,"left")?"◀左 ":"")+(valid(c,"right")?"右▶":"")+(!valid(c,"left")&&!valid(c,"right")?"なし（引くを選択）":"")})}return e}
function show(title,desc,label,fn){$("modalChoices").replaceChildren();$("modalChoices").classList.add("hidden");$("overlay").querySelector(".panel").classList.remove("choice-mode");$("modalButton").style.display="";$("modalTitle").textContent=title;$("modalText").textContent=desc;$("modalButton").textContent=label;$("roomLauncher").style.display=(label==="▶ ゲームスタート"||label==="もう一度プレイ")?"block":"none";$("overlay").classList.remove("hidden");modalAction=fn}
$("modalButton").addEventListener("click",()=>{const fn=modalAction;$("overlay").classList.add("hidden");modalAction=null;if(fn)fn()});
function choose(title,desc,options,onPick){const list=$("modalChoices");list.replaceChildren();list.classList.remove("hidden");$("overlay").querySelector(".panel").classList.add("choice-mode");$("modalTitle").textContent=title;$("modalText").textContent=desc;$("modalButton").style.display="none";$("overlay").classList.remove("hidden");modalAction=null;options.forEach(opt=>{const btn=document.createElement("button");btn.type="button";btn.className="pick"+(opt.person?" person":"");if(opt.card){btn.appendChild(tile(opt.card,-1,false));const caption=document.createElement("span");caption.textContent=opt.label;btn.appendChild(caption)}else{btn.textContent=opt.label}btn.addEventListener("click",()=>{list.replaceChildren();onPick(opt)});list.appendChild(btn)})}
function chooseFromHand(i,title,desc,onPick){const options=players[i].map((c,index)=>({card:c,index,label:names[c.type]}));if(!options.length){onPick(null);return}if(i!==0){onPick(options[rnd(options.length)]);return}choose(title,desc,options,onPick)}

function start(){window.LAAudio?.start();window.LAAudio?.cue("join");const token=++dealVersion;document.querySelectorAll(".deal-fly-card").forEach(el=>el.remove());skipTarget=-1;players=Array.from({length:4},()=>Array.from({length:INITIAL_HAND_COUNT},card));board=[card()];players[0][0].left=board[0].right;players[0][0].type=0;turn=0;direction=1;selected=-1;started=true;locked=true;shields=[0,0,0,0];bonusTurn=false;lastPlaced=null;board[0].placedSide="start";recentPlays=[board[0]];$("hand").classList.add("dealing");$("deckCounter").textContent="山札から"+INITIAL_HAND_COUNT+"枚";render();$("message").textContent="山札からカードを配っています…";requestAnimationFrame(()=>dealOpening(token))}
function dealOpening(token){const deck=$("dealDeck").querySelector(".deck-back"),hand=$("hand"),cards=Array.from(hand.children);
if(!deck||!cards.length){endDeal(token);return}
const finishCount={value:0};
cards.forEach((target,index)=>setTimeout(()=>{
if(token!==dealVersion)return;
const from=deck.getBoundingClientRect(),to=target.getBoundingClientRect();const flyer=document.createElement("div");flyer.className="deal-fly-card";flyer.textContent="✦";flyer.style.left=from.left+"px";flyer.style.top=from.top+"px";flyer.style.width=from.width+"px";flyer.style.height=from.height+"px";document.body.appendChild(flyer);
const completed=()=>{flyer.remove();if(token!==dealVersion)return;window.LAAudio?.cue("deal");target.classList.add("dealt");finishCount.value++;$("deckCounter").textContent="残り "+(cards.length-finishCount.value)+"枚";if(finishCount.value===cards.length)setTimeout(()=>endDeal(token),220)};
if(window.matchMedia("(prefers-reduced-motion: reduce)").matches||!flyer.animate){setTimeout(completed,70)}else{
const move=flyer.animate([{transform:"translate(0px,0px) scale(1)",opacity:1},{transform:"translate("+(to.left-from.left)+"px,"+(to.top-from.top)+"px) scale("+(to.width/from.width)+","+(to.height/from.height)+") rotate(-7deg)",opacity:1}],{duration:340,easing:"cubic-bezier(.2,.8,.25,1)",fill:"forwards"});
move.onfinish=completed;move.oncancel=()=>{flyer.remove()};
}
},index*150))}
function endDeal(token){if(token!==dealVersion)return;$("hand").classList.remove("dealing");$("deckCounter").textContent="山札";locked=false;render();$("message").textContent="あなたの番です。カードを選択してください。"}

// Display the latest card together with its actual neighbours in physical board order.
// Left placement: new card, then the next two cards to its right.
// Right placement: the previous two cards, then the new card.
function visibleCards(){
 if(!board.length)return [];
 if(board.length<=3)return board.slice();
 const latestIndex=Math.max(0,board.indexOf(lastPlaced));
 const side=lastPlaced?.placedSide;
 const first=side==="left"?latestIndex:side==="right"?latestIndex-2:latestIndex-1;
 const start=Math.max(0,Math.min(board.length-3,first));
 return board.slice(start,start+3);
}
function visibleEnds(){const shown=visibleCards();return {left:shown[0]||board[0],right:shown[shown.length-1]||board[board.length-1]}}
function valid(c,side){if(!board.length)return true;const ends=visibleEnds();return c.type===5||(side==="left"?match(c.right,ends.left.left):match(ends.right.right,c.left))}
function render(){const b=$("board");b.replaceChildren();const track=document.createElement("div");track.className="board-track";const shown=visibleCards();track.classList.add("stable-track");const leftSpace=document.createElement("div");leftSpace.className="history-outer-space";track.appendChild(leftSpace);shown.forEach((c,ix)=>{if(ix>0&&board.indexOf(c)!==board.indexOf(shown[ix-1])+1){const space=document.createElement("div");space.className="history-inner-space";space.setAttribute("aria-label","間に非表示のカードがあります");track.appendChild(space)}const slot=document.createElement("div");slot.className="history-slot"+(ix===shown.length-1?" end-slot":"")+(c===lastPlaced?" latest":"");const tag=document.createElement("span");tag.className="place-tag";tag.textContent=(c===lastPlaced?"★ ":"")+(c.placedSide==="left"?"◀ 左":c.placedSide==="right"?"右 ▶":"開始");slot.appendChild(tag);slot.appendChild(tile(c,0,false));track.appendChild(slot)});const rightSpace=document.createElement("div");rightSpace.className="history-outer-space";track.appendChild(rightSpace);b.appendChild(track);$("recentCount").textContent=shown.length+" / 3";const h=$("hand");h.replaceChildren();const handCount=players[0]?.length||1;const available=Math.max(180,h.clientWidth||window.innerWidth-220);const heightAvailable=Math.max(54,(h.clientHeight||90)-4);const isPortrait=window.matchMedia("(orientation: portrait)").matches;const width=Math.max(isPortrait?56:36,Math.min(108,Math.floor(heightAvailable*1.05),Math.floor((available-8-Math.max(0,handCount-1)*2)/handCount)));h.style.setProperty("--hand-card-w",width+"px");h.style.setProperty("--hand-card-h",Math.min(Math.round(width*.98),Math.floor(heightAvailable))+"px");players[0]?.forEach((c,i)=>h.appendChild(tile(c,i,true)));$("count").textContent=players[0]?.length+"枚";for(let i=1;i<=3;i++){const item=$("cpu"+i);item.innerHTML=cpuAvatar(i)+'<span class="cpu-name">CPU '+i+'</span><span class="cpu-count">'+(players[i]?.length??INITIAL_HAND_COUNT)+'枚</span>';item.classList.toggle("cpu-turn",started&&turn===i)}$("turn").textContent=started?(turn===0?"あなたの番":"CPU "+turn+" の番"):"ゲーム開始前";$("playLeft").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"left");$("playRight").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"right");$("draw").disabled=!started||locked||turn!==0}
function advance(){if(bonusTurn){bonusTurn=false}else{turn=(turn+direction+4)%4}
let attempts=0;while(turn===skipTarget&&attempts<4){const skipped=turn;skipTarget=-1;turn=(turn+direction+4)%4;attempts++;$("message").textContent="CPU "+skipped+" の手番を飛ばしました。"}
locked=turn!==0;render();if(turn!==0){setTimeout(cpuMove,750)}else{$("message").textContent="あなたの番です。カードを選んでください。"}}
function finish(i){window.LAAudio?.cue(i===0?"win":"lose");started=false;locked=true;render();show(i===0?"あなたの勝利！":"CPU "+i+" の勝利", "手札をすべて出しました。もう一度遊べます。","もう一度プレイ",start)}
// Route all drawing through the same permanent deck. The game state changes once per card,
// and the callback fires only after the visual card has reached its recipient.
function flyFromDeck(targetEl,done){
 const deck=$("dealDeck").querySelector(".deck-back");
 if(!deck||!targetEl){done();return}
 const from=deck.getBoundingClientRect(),to=targetEl.getBoundingClientRect();
 $("dealDeck").classList.remove("deck-pulse");void $("dealDeck").offsetWidth;$("dealDeck").classList.add("deck-pulse");
 if(!from.width||!to.width||window.matchMedia("(prefers-reduced-motion: reduce)").matches){setTimeout(done,90);return}
 const flyer=document.createElement("div");flyer.className="deal-fly-card";flyer.textContent="✦";flyer.style.left=from.left+"px";flyer.style.top=from.top+"px";flyer.style.width=from.width+"px";flyer.style.height=from.height+"px";document.body.appendChild(flyer);
 let finished=false;const finish=()=>{if(finished)return;finished=true;flyer.remove();done()};
 try{const anim=flyer.animate([
 {transform:"translate(0,0) scale(1) rotate(0deg)",opacity:1},
 {transform:"translate("+(to.left-from.left)*.65+"px,"+((to.top-from.top)*.65-18)+"px) scale(.9) rotate(-10deg)",opacity:1,offset:.7},
 {transform:"translate("+(to.left-from.left)+"px,"+(to.top-from.top)+"px) scale("+(to.width/from.width)+","+(to.height/from.height)+") rotate(0deg)",opacity:1}
 ],{duration:360,easing:"cubic-bezier(.22,.8,.22,1)",fill:"forwards"});
 anim.onfinish=finish;anim.oncancel=finish;setTimeout(finish,580)}catch(e){finish()}
}
function drawFromDeck(playerIndex,amount,done){
 let remaining=amount;
 function next(){if(!started||remaining<=0){if(done)done();return}
  players[playerIndex].push(card());selected=-1;render();
  const hand=$("hand");
  const receiver=playerIndex===0?hand.lastElementChild:$("cpu"+playerIndex);
  if(playerIndex===0&&receiver)receiver.classList.add("draw-receiving");
  flyFromDeck(receiver,()=>{
    if(playerIndex===0&&receiver){receiver.classList.remove("draw-receiving");receiver.classList.add("draw-arrived")}
    window.LAAudio?.cue("draw");remaining--;$("deckCounter").textContent=remaining?"山札 → "+remaining+"枚":"山札";
    setTimeout(next,105);
  });
 }
 next()
}
function attack(t,n,done){const who=t===0?"あなた":"CPU "+t;if(shields[t]){shields[t]=0;done(who+"のシールドがドロー"+n+"を防ぎました。");return} $("info").textContent="ドロー"+n+"："+who+"が山札から"+n+"枚引いています…";drawFromDeck(t,n,()=>done(who+"が山札から"+n+"枚引きました。"))}
let skipTarget=-1;
function effectChoice(i,c,done){const next=(i+direction+4)%4;
if(c.type===4){chooseFromHand(i,"救済：捨てるカード","手札から追加で捨てるカードを選んでください。",opt=>{if(opt){players[i].splice(opt.index,1);done(names[opt.card.type]+"を捨てました。")}else done("捨てる手札がありません。")});return}
if(c.type===6){chooseFromHand(i,"鍛冶屋：交換するカード","交換したいカードを選んでください。新しいカードを1枚引きます。",opt=>{if(opt){players[i].splice(opt.index,1);players[i].push(card());done(names[opt.card.type]+"を新しいカードと交換しました。")}else done("交換する手札がありません。")});return}
if(c.type===7){chooseFromHand(i,"プレゼント：渡すカード","次のプレイヤーへ渡すカードを選んでください。",opt=>{if(opt){players[next].push(players[i].splice(opt.index,1)[0]);done(names[opt.card.type]+"を次のプレイヤーへ渡しました。")}else done("渡す手札がありません。")});return}
if(c.type===3){const targets=[1,2,3].filter(n=>n!==i).map(n=>({person:true,index:n,label:"🤖 CPU "+n}));if(i!==0){skipTarget=next;done("CPU "+next+"の次の手番を飛ばします。");return}choose("突風：妨害する相手","手番を飛ばす相手を選んでください。",targets,opt=>{skipTarget=opt.index;done("CPU "+opt.index+"の次の手番を飛ばします。")});return}
if(c.type===13||c.type===16){const targets=players.map((h,p)=>({person:true,index:p,label:(p===0?"あなた":"CPU "+p)+" "+h.length+"枚"})).filter(o=>o.index!==i&&(c.type===16||players[o.index].length>0));if(!targets.length){done("対象の手札がありません。");return}
const handle=opt=>{const target=opt.index;if(c.type===13){const stolen=players[target].splice(rnd(players[target].length),1)[0];players[i].push(stolen);done((target===0?"あなた":"CPU "+target)+"から「"+names[stolen.type]+"」を1枚奪いました。")}else{const mine=players[i];players[i]=players[target];players[target]=mine;done((target===0?"あなた":"CPU "+target)+"と手札を交換しました。")}};
if(i!==0){handle(targets[rnd(targets.length)]);return}
choose(c.type===13?"盗賊：奪う相手":"ハンドチェンジ：交換相手","対象のプレイヤーを選んでください。",targets,handle);return}
if(c.type===14){chooseFromHand(i,"リペア：修理するカード","選んだカードを場の左右どちらにもつながる形状にします。",opt=>{if(!opt){done("修理するカードがありません。");return}const ends=visibleEnds();opt.card.left=ends.right.right;opt.card.right=ends.left.left;done("「"+names[opt.card.type]+"」の接続口を修理しました。")});return}
done(descriptions[c.type])
}
function animatePlacement(c,sourceRect,onDone){
  const target=$("board").querySelector(".history-slot.latest .tile");
  if(!target||!sourceRect||!target.animate||window.matchMedia("(prefers-reduced-motion: reduce)").matches){onDone();return}
  const rect=target.getBoundingClientRect();
  const ghost=tile(c,-1,false);ghost.classList.remove("new-card","selected");ghost.classList.add("play-flight");
  ghost.style.setProperty("width",rect.width+"px","important");
  ghost.style.setProperty("height",rect.height+"px","important");
  ghost.style.setProperty("left",sourceRect.left+"px","important");
  ghost.style.setProperty("top",sourceRect.top+"px","important");
  ghost.style.setProperty("flex","none","important");
  document.body.appendChild(ghost);
  target.classList.add("awaiting-landing");
  const dx=rect.left-sourceRect.left,dy=rect.top-sourceRect.top;
  const scale=sourceRect.width/Math.max(1,rect.width);
  let finished=false;
  const land=()=>{
    if(finished)return;finished=true;ghost.remove();window.LAAudio?.cue("place");
    target.classList.remove("awaiting-landing");target.classList.add("just-landed");
    const ring=document.createElement("div");ring.className="impact-ring";
    ring.style.left=(rect.left+rect.width/2)+"px";ring.style.top=(rect.top+rect.height/2)+"px";
    document.body.appendChild(ring);setTimeout(()=>ring.remove(),480);
    setTimeout(onDone,220);
  };
  try{
    const anim=ghost.animate([
      {transform:"translate(0px,0px) scale("+scale+") rotate(-9deg)",opacity:.94},
      {transform:"translate("+dx+"px,"+(dy-20)+"px) scale(1.1) rotate(3deg)",opacity:1,offset:.8},
      {transform:"translate("+dx+"px,"+dy+"px) scale(1) rotate(0deg)",opacity:1}
    ],{duration:490,easing:"cubic-bezier(.22,.7,.2,1)",fill:"forwards"});
    anim.onfinish=land;anim.oncancel=land;
    setTimeout(land,650);
  }catch(e){land()}
}

function apply(i,idx,side="right"){const sourceEl=i===0?$("hand").children[idx]:$("cpu"+i);const sourceRect=sourceEl?sourceEl.getBoundingClientRect():null;const c=players[i].splice(idx,1)[0];if(board.length){const ends=visibleEnds();if(c.type===5){if(side==="left")c.right=ends.left.left;else c.left=ends.right.right}if(side==="left")board.splice(board.indexOf(ends.left),0,c);else board.splice(board.indexOf(ends.right)+1,0,c)}else board.push(c);c.placedSide=side;recentPlays.push(c);lastPlaced=c;selected=-1;let text=descriptions[c.type],target=(i+direction+4)%4;
if(c.type===2){direction*=-1;text="進行方向が逆になりました。"}
if(c.type===8){shields[i]=1;text="次のドロー攻撃を一度防ぎます。"}
if(c.type===9){for(const h of players)for(const v of h){v.left=1+rnd(7);v.right=1+rnd(7)}text="全員の手札の凹凸が変化しました。"}
if(c.type===11){bonusTurn=true;text="もう一度自分の番です！"}
const complete=summary=>{if(c.type!==0)window.LAAudio?.cue("special");render();const report=names[c.type]+"： "+summary;$("info").textContent=report;$("message").textContent=report;show(names[c.type],summary,"確認して次へ",()=>{if(players[i].length===0)finish(i);else advance()})};
render();animatePlacement(c,sourceRect,()=>{if(c.type===1||c.type===10||c.type===12){attack(target,c.type===1?1:c.type===10?2:3,complete)}
else if(c.type===15){const targets=[0,1,2,3].filter(p=>p!==i);let remaining=targets.length;const messages=[];const next=()=>{if(!targets.length){complete("ほかの3人が1枚ずつ引きました。"+messages.join(" "));return}const t=targets.shift();if(shields[t]){shields[t]=0;messages.push((t===0?"あなた":"CPU "+t)+"はシールドで防御。");next()}else{drawFromDeck(t,1,()=>{messages.push((t===0?"あなた":"CPU "+t)+"が1枚ドロー。");next()})}};next()}
else if([3,4,6,7,13,14,16].includes(c.type)){effectChoice(i,c,complete)}else complete(text)})}

for(const side of ["left","right"]){$(side==="left"?"playLeft":"playRight").addEventListener("click",()=>{if(!started||locked||turn!==0||selected<0)return;const c=players[0][selected];if(!valid(c,side)){$("info").textContent="この側の接続口には合いません。";return}locked=true;apply(0,selected,side)})}
$("draw").addEventListener("click",()=>{if(!started||locked||turn!==0)return;locked=true;selected=-1;$("message").textContent="山札から1枚引いています…";drawFromDeck(0,1,()=>{$("info").textContent="山札から1枚引きました。";$("message").textContent="山札から1枚引きました。";advance()})});
function cpuMove(){if(!started)return;const i=turn;let side="right";let idx=players[i].findIndex(c=>valid(c,"right"));if(idx<0){side="left";idx=players[i].findIndex(c=>valid(c,"left"))}if(idx<0){$("message").textContent="CPU "+i+" は山札から1枚引きます。";drawFromDeck(i,1,()=>{$("info").textContent="CPU "+i+" は山札から1枚引きました。";$("message").textContent="CPU "+i+" は1枚引きました。";advance()})}else apply(i,idx,side)}
$("audioMute").addEventListener("click",()=>{const muted=window.LAAudio?.toggle();$("audioMute").textContent=muted?"🔇":"🔊";$("audioMute").setAttribute("aria-label",muted?"音声をオン":"音声をミュート")});
$("audioVolume").addEventListener("input",()=>{const vol=Number($("audioVolume").value)/100;window.LAAudio?.setVolume(vol);if(vol>0&&window.LAAudio?.muted){window.LAAudio.setMuted(false);$("audioMute").textContent="🔊"}});
window.addEventListener("resize",()=>{if(started&&$("overlay").classList.contains("hidden"))render()});
show("LINK ARENA","突起がある場所に穴があれば接続できます。穴が余っていてもOK！ 左右どちらにもつなげられます。手札を先になくした人が勝ちです。","▶ ゲームスタート",start);
})();
</script></body></html>
