<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f20"><title>LINK ARENA Mobile v0.9</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09271c;color:#fff5d6;font-family:system-ui,-apple-system,sans-serif}button{touch-action:manipulation;cursor:pointer;font:inherit;border:0;border-radius:12px;padding:13px;font-weight:800}main{max-width:720px;margin:auto;padding:12px;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;color:#ffdc83;margin:6px 0}.small{font-size:12px;color:#bdd9c8}.table{height:44dvh;min-height:300px;border:8px solid #78512b;border-radius:28px;position:relative;background:radial-gradient(ellipse,#0ca958,#075d37);box-shadow:inset 0 0 0 3px #d2b36b;overflow:hidden}.cpu{position:absolute;background:#093c2bdc;border:1px solid #8ba58b;border-radius:20px;padding:7px;font-size:12px}.top{top:9px;left:50%;transform:translateX(-50%)}.left{top:45%;left:5px}.right{top:45%;right:5px}.board-title{position:absolute;top:29%;left:50%;transform:translate(-50%,-50%);font-size:12px;white-space:nowrap;background:#063f2ab8;padding:5px 13px;border-radius:24px;color:#fff4ce}.board{position:absolute;left:3%;right:3%;top:33%;height:135px;display:flex;align-items:center;justify-content:flex-start;gap:0;overflow-x:auto;padding:8px 12px}.board .tile{margin-right:-4px}.board .tile{flex-shrink:0}.tile{--c:#e8bc70;position:relative;background:var(--c);color:#17362b;width:73px;height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 9px;font-weight:900;text-align:center;user-select:none}.tile svg.card-outline{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;filter:drop-shadow(0 2px 2px #0008)}.tile{isolation:isolate;background:transparent;width:84px;height:110px;flex-shrink:0}.tile b{font-size:23px}.tile .card-art{position:relative;z-index:1;width:58px;height:55px;flex-shrink:0;overflow:visible;filter:drop-shadow(0 1px 2px #0003);pointer-events:none}.tile .art-label{font-size:8px;letter-spacing:.4px;color:#33483e}.tile .effectTag{font-size:7px;line-height:1.1;color:#32534d;max-width:64px}.tile.new-card{animation:cardEnter .42s cubic-bezier(.2,1.4,.4,1) both}@keyframes cardEnter{from{opacity:0;transform:translateY(-28px) scale(.82)}to{opacity:1;transform:translateY(0) scale(1)}}.tile.selected{z-index:2}.board .tile{transition:margin .2s}.tile small{font-size:10px}.tile.selected{outline:3px solid #fff;filter:brightness(1.2);transform:translateY(-10px)}.hand{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:18px 3px 12px;min-height:130px}.hand .tile{flex-shrink:0}.actions{display:flex;gap:9px}.actions button{flex:1;background:#f8d678;color:#193529;min-height:54px}.actions button:last-child{background:#e4f0e8;flex:.65}.actions button:disabled{opacity:.45}.info{background:#123f30;border:1px solid #527f66;padding:12px;border-radius:14px;margin:10px 0;font-size:14px;line-height:1.6}.overlay{position:fixed;inset:0;background:#001a13d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.panel{width:min(100%,450px);background:linear-gradient(#315746,#17392e);border:3px solid #efd27e;border-radius:24px;padding:24px;text-align:center;box-shadow:0 15px 60px #000a}.panel h2{color:#ffe18b;font-size:32px;margin:5px}.panel p{line-height:1.8}.panel button{width:100%;background:#ffdb7a;color:#233b2d;min-height:56px;margin-top:10px}.hidden{display:none}.msg{font-size:13px;text-align:center;margin-top:10px;color:#e9dcae}
</style></head><body><main><header><div><h1>LINK ARENA</h1><div class="small">Mobile · パズルカード対戦</div></div><div id="turn" class="small">ゲーム開始前</div></header>
<div class="table"><div class="cpu top" id="cpu2">🤖 CPU 2</div><div class="cpu left" id="cpu1">🤖 CPU 1</div><div class="cpu right" id="cpu3">🤖 CPU 3</div><div class="board-title">最近プレイされたカード <span id="recentCount">1 / 3</span></div><div class="board" id="board"></div></div>
<div class="info" id="info">中央には直近にプレイされた3枚を表示します。手札の絵柄と効果を確認して左右につなげましょう。</div><div class="small">あなたの手札 <span id="count"></span></div><div class="hand" id="hand"></div>
<div class="actions"><button id="playLeft">◀ 左につなぐ</button><button id="playRight">右につなぐ ▶</button><button id="draw">引く</button></div><div class="msg" id="message">ゲームスタートを押してください。</div></main>
<div class="overlay" id="overlay"><div class="panel"><h2 id="modalTitle">LINK ARENA</h2><p id="modalText">パズルの凹凸を合わせてカードをつなぐ対戦ゲーム。カードを選んで左右に配置し、最初に手札をなくした人が勝ち！</p><button id="modalButton" type="button">▶ ゲームスタート</button></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const names=["ただのカード","ドロー1","リバース","突風","救済","ミミック","鍛冶屋"];
const descriptions=["特殊効果なし。凹凸をつなげて出します。","次のプレイヤーがカードを1枚引きます。","プレイする順番が逆になります。","次のプレイヤーの手番を飛ばします。","自分の手札から追加で1枚捨てます。","接続する形を合わせやすい万能カードです。","手札を1枚交換します。"];
const colors=["#eec56c","#a7dcf3","#f3a6af","#b4dfad","#d4b2ef"];const shortEffects=["形を合わせる","次の人+1枚","進行方向反転","次の人を飛ばす","手札を1枚減らす","接続万能","1枚交換"];
let players=[],board=[],turn=0,direction=1,selected=-1,started=false,locked=false,modalAction=null,lastPlaced=null,recentPlays=[];
const rnd=n=>Math.floor(Math.random()*n);
function card(){const type=rnd(7);return {type,shape:rnd(3),left:rnd(3),right:rnd(3),color:rnd(colors.length)}}
function match(a,b){return (a===2&&b===2)||(a===0&&b===1)||(a===1&&b===0)}
function edge(k,side){if(side==="r")return k===1?"L 68 35 C 87 28 95 47 79 55 C 95 63 87 82 68 75":k===0?"L 68 35 C 53 28 53 47 64 55 C 53 63 53 82 68 75":"L 68 75";return k===1?"L 16 75 C -3 82 -11 63 5 55 C -11 47 -3 28 16 35":k===0?"L 16 75 C 31 82 31 63 20 55 C 31 47 31 28 16 35":"L 16 35"}
const artworkPaths=["<path d=\"M12 28L8 21L15 8L26 5L38 8L48 21L44 28\" fill=\"#d19c48\" stroke=\"#70512c\" stroke-width=\"2\"/><path d=\"M14 23L14 16L23 12L26 5L35 12L44 16L44 24Z\" fill=\"#efd081\" stroke=\"#70512c\" stroke-width=\"2\"/><rect x=\"14\" y=\"22\" width=\"30\" height=\"24\" rx=\"9\" fill=\"#6e777c\" stroke=\"#46555e\" stroke-width=\"2\"/><path d=\"M17 25Q29 22 41 25L40 33H18Z\" fill=\"#303e4d\"/><circle cx=\"24\" cy=\"28\" r=\"2.5\" fill=\"#ffde79\"/><circle cx=\"34\" cy=\"28\" r=\"2.5\" fill=\"#ffde79\"/><path d=\"M45 33L57 36L54 50L45 56L37 49L37 36Z\" fill=\"#e7aa5a\" stroke=\"#936039\" stroke-width=\"2\"/><path d=\"M46 38v12M41 44h10\" stroke=\"#ffebaa\" stroke-width=\"3\"/>","<path d=\"M28 13Q13 30 16 41Q19 56 34 53Q51 50 48 37Q46 26 34 13Z\" fill=\"#6bcfea\" stroke=\"#267eae\" stroke-width=\"2\"/><path d=\"M10 24L18 10L39 4L52 17L46 21L34 13L14 25Z\" fill=\"#4d77c5\" stroke=\"#394d94\" stroke-width=\"2\"/><path d=\"M18 11L32 7L33 14L43 16\" fill=\"none\" stroke=\"#b9eaff\" stroke-width=\"2\"/><circle cx=\"27\" cy=\"35\" r=\"2.3\" fill=\"#204c71\"/><circle cx=\"39\" cy=\"35\" r=\"2.3\" fill=\"#204c71\"/><path d=\"M29 42Q34 47 39 41\" fill=\"none\" stroke=\"#a54e7e\" stroke-width=\"2\"/><path d=\"M51 28Q62 34 54 43\" fill=\"none\" stroke=\"#47c7ee\" stroke-width=\"4\" stroke-linecap=\"round\"/>","<path d=\"M9 21L13 8L25 17L35 12L39 23L35 35L14 35Z\" fill=\"#f7c8bd\" stroke=\"#b9556c\" stroke-width=\"2\"/><path d=\"M30 38L36 23L47 13L51 24L57 27L51 42Z\" fill=\"#f68f8f\" stroke=\"#b9556c\" stroke-width=\"2\"/><circle cx=\"23\" cy=\"26\" r=\"2\" fill=\"#624356\"/><circle cx=\"46\" cy=\"31\" r=\"2\" fill=\"#624356\"/><path d=\"M17 29l4 3m28 3l4-2\" stroke=\"#ad4774\" stroke-width=\"2\"/><path d=\"M11 45Q23 56 34 47M52 49Q42 59 29 55\" fill=\"none\" stroke=\"#d45691\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M32 44l4 2-4 3\" stroke=\"#d45691\" fill=\"none\" stroke-width=\"2\"/>","<path d=\"M9 41Q19 32 22 19Q29 7 42 14Q55 20 48 34Q41 44 28 37\" fill=\"none\" stroke=\"#69bdac\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M9 41Q19 32 22 19Q29 7 42 14\" fill=\"none\" stroke=\"#c7edcd\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M39 13L48 5L47 18L58 22L50 28L44 25\" fill=\"#9be1d4\" stroke=\"#408f84\" stroke-width=\"2\"/><circle cx=\"43\" cy=\"18\" r=\"2\" fill=\"#275f65\"/><path d=\"M20 47Q40 58 57 41M6 50Q14 55 18 52\" fill=\"none\" stroke=\"#88e1cb\" stroke-width=\"3\" stroke-linecap=\"round\"/>","<path d=\"M13 32Q5 14 24 12Q42 6 47 30L43 42L17 41Z\" fill=\"#b49ddb\" stroke=\"#6a6299\" stroke-width=\"2\"/><path d=\"M16 23Q14 11 31 9Q45 11 44 21\" fill=\"none\" stroke=\"#eecef3\" stroke-width=\"5\"/><path d=\"M17 28Q17 23 23 23Q26 28 29 24Q36 19 40 26L38 39L23 42Z\" fill=\"#ffe5d2\" stroke=\"#a8889d\" stroke-width=\"1.5\"/><path d=\"M24 30q3 4 6 0m6-1q3 4 5 0\" fill=\"none\" stroke=\"#8a5a77\" stroke-width=\"2\"/><path d=\"M29 40Q21 49 11 46M37 41Q45 48 55 43\" fill=\"none\" stroke=\"#77bb83\" stroke-width=\"3\"/><path d=\"M50 11l3 4 5-1-3 5 2 4-6-2-4 3v-6l-4-3 6-1Z\" fill=\"#ffd77d\" stroke=\"#b7a15b\" stroke-width=\"1\"/>","<path d=\"M15 40Q9 19 29 16Q47 14 52 32Q54 46 39 48Q24 50 29 38Q34 31 41 37Q45 42 40 44\" fill=\"#ad8dde\" stroke=\"#66499c\" stroke-width=\"3\"/><path d=\"M17 24Q24 8 39 12L54 24L48 34L30 32Z\" fill=\"#c7a2ec\" stroke=\"#7755ae\" stroke-width=\"2\"/><circle cx=\"43\" cy=\"24\" r=\"8\" fill=\"#fff6db\" stroke=\"#68519d\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"24\" r=\"4\" fill=\"#554786\"/><path d=\"M50 34Q59 36 60 31\" fill=\"none\" stroke=\"#f2a6b8\" stroke-width=\"3\"/><circle cx=\"28\" cy=\"24\" r=\"2\" fill=\"#fff\"/>","<path d=\"M11 20L18 10L42 11L50 20V44L43 52H17L10 43Z\" fill=\"#a88a70\" stroke=\"#675049\" stroke-width=\"2\"/><rect x=\"15\" y=\"22\" width=\"31\" height=\"24\" rx=\"9\" fill=\"#b9b7a9\" stroke=\"#6d716f\" stroke-width=\"2\"/><rect x=\"18\" y=\"28\" width=\"25\" height=\"11\" rx=\"5\" fill=\"#46545a\"/><circle cx=\"25\" cy=\"33\" r=\"3\" fill=\"#ffda62\"/><circle cx=\"36\" cy=\"33\" r=\"3\" fill=\"#ffda62\"/><path d=\"M18 11h23\" stroke=\"#d9bd77\" stroke-width=\"5\"/><path d=\"M49 48L56 22M48 20l10 4 4-8-14-5Z\" fill=\"#cc9251\" stroke=\"#70503f\" stroke-width=\"2\"/><path d=\"M5 50l8-8\" stroke=\"#efb35f\" stroke-width=\"3\"/><path d=\"M7 42l3 5 5-1\" fill=\"#ffe087\"/>"];
function illustration(type){return '<svg class="card-art" viewBox="0 0 64 64" aria-hidden="true">'+artworkPaths[type]+'</svg>'}
function tile(c,i,hand){const e=document.createElement("div");e.className="tile"+(hand&&selected===i?" selected":"");const d="M 16 5 L 68 5 "+edge(c.right,"r")+" L 68 105 L 16 105 "+edge(c.left,"l")+" Z";e.innerHTML='<svg class="card-outline" viewBox="0 0 84 110" aria-hidden="true"><path d="'+d+'" fill="'+colors[c.color]+'" stroke="#674c2d" stroke-width="2.5" stroke-linejoin="round"/><path d="M 25 13 H 59" stroke="#fff9" stroke-width="2"/></svg>'+illustration(c.type)+'<small>'+names[c.type]+'</small><span class="art-label">'+["●","◆","✦"][c.shape]+'</span>';if(!hand&&c===lastPlaced)e.classList.add("new-card");if(hand){e.addEventListener("click",()=>{selected=i;render();$("info").textContent=names[c.type]+"： "+descriptions[c.type]})}return e}
function show(title,desc,label,fn){$("modalTitle").textContent=title;$("modalText").textContent=desc;$("modalButton").textContent=label;$("overlay").classList.remove("hidden");modalAction=fn}
$("modalButton").addEventListener("click",()=>{const fn=modalAction;$("overlay").classList.add("hidden");modalAction=null;if(fn)fn()});
function start(){players=Array.from({length:4},()=>Array.from({length:7},card));board=[card()];players[0][0].left=board[0].right===2?2:1-board[0].right;players[0][0].type=0;turn=0;direction=1;selected=-1;started=true;locked=false;lastPlaced=null;recentPlays=[board[0]];render();$("message").textContent="あなたの番です。カードを選択してください。"}
function valid(c,side){return c.type===5||board.length===0||(side==="left"?match(c.right,board[0].left):match(c.left,board[board.length-1].right))}
function render(){const b=$("board");b.replaceChildren();recentPlays.slice(-3).forEach(c=>b.appendChild(tile(c,0,false)));$("recentCount").textContent=Math.min(3,recentPlays.length)+" / 3";const h=$("hand");h.replaceChildren();players[0]?.forEach((c,i)=>h.appendChild(tile(c,i,true)));$("count").textContent=players[0]?.length+"枚";for(let i=1;i<=3;i++)$("cpu"+i).textContent="🤖 CPU "+i+" "+(players[i]?.length??7)+"枚";$("turn").textContent=started?(turn===0?"あなたの番":"CPU "+turn+" の番"):"ゲーム開始前";$("playLeft").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"left");$("playRight").disabled=!started||locked||turn!==0||selected<0||!valid(players[0][selected],"right");$("draw").disabled=!started||locked||turn!==0}
function advance(){turn=(turn+direction+4)%4;locked=turn!==0;render();if(turn!==0){setTimeout(cpuMove,750)}else{$("message").textContent="あなたの番です。カードを選んでください。"}}
function finish(i){started=false;locked=true;render();show(i===0?"あなたの勝利！":"CPU "+i+" の勝利", "手札をすべて出しました。もう一度遊べます。","もう一度プレイ",start)}
function apply(i,idx,side="right"){const c=players[i].splice(idx,1)[0];if(c.type===5&&board.length){if(side==="left")c.right=board[0].left===2?2:1-board[0].left;else c.left=board[board.length-1].right===2?2:1-board[board.length-1].right}if(side==="left")board.unshift(c);else board.push(c);recentPlays.push(c);lastPlaced=c;selected=-1;let text=descriptions[c.type];if(c.type===1){let target=(i+direction+4)%4;players[target].push(card());text="次のプレイヤーがカードを1枚引きました。"}if(c.type===2){direction*=-1;text="ターンの進行方向が逆になりました。"}if(c.type===3){turn=(turn+direction+4)%4;text="次のプレイヤーの手番を飛ばしました。"}if(c.type===4&&players[i].length){players[i].splice(rnd(players[i].length),1);text="手札を追加で1枚捨てました。"}if(c.type===6&&players[i].length){players[i].splice(rnd(players[i].length),1);players[i].push(card());text="手札を1枚交換しました。"}render();show(names[c.type],text,"確認して次へ",()=>{if(players[i].length===0)finish(i);else advance()})}
for(const side of ["left","right"]){$(side==="left"?"playLeft":"playRight").addEventListener("click",()=>{if(!started||locked||turn!==0||selected<0)return;const c=players[0][selected];if(!valid(c,side)){$("info").textContent="この側の接続口には合いません。";return}locked=true;apply(0,selected,side)})}
$("draw").addEventListener("click",()=>{if(!started||locked||turn!==0)return;players[0].push(card());selected=-1;render();$("message").textContent="カードを1枚引きました。";advance()});
function cpuMove(){if(!started)return;const i=turn;let side="right";let idx=players[i].findIndex(c=>valid(c,"right"));if(idx<0){side="left";idx=players[i].findIndex(c=>valid(c,"left"))}if(idx<0){players[i].push(card());$("message").textContent="CPU "+i+" は1枚引きました。";advance()}else apply(i,idx,side)}
show("LINK ARENA","カードの凹凸を合わせるパズル型カード対戦。手札を先になくした人が勝ちです。カードをタップすると効果を読めます。","▶ ゲームスタート",start);
})();
</script></body></html>
